appId: com.anys.codex-skin
productName: Codex Skin
asar: true
directories:
  buildResources: apps/desktop/build
  output: release
extraMetadata:
  main: desktop-dist/main.js
files:
  - desktop-dist/main.js
  - package.json
extraResources:
  - from: dist/ui
    to: ui
mac:
  category: public.app-category.utilities
  entitlements: apps/desktop/build/entitlements.mac.plist
  entitlementsInherit: apps/desktop/build/entitlements.mac.inherit.plist
  icon: apps/desktop/build/icon.icns
  extendInfo:
    NSAppleEventsUsageDescription: Codex Skin 需要正常退出并重新打开 Codex，以启用主题背景。
  hardenedRuntime: true
  target:
    - dmg
    - zip
artifactName: ${productName}-${version}-${arch}.${ext}
