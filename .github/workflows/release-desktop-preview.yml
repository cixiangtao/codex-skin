name: Release macOS desktop preview

on:
  push:
    branches:
      - main
    paths:
      - .github/README.md
      - config/release.json
      - package.json
      - bun.lock

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: desktop-preview-release
  cancel-in-progress: false

jobs:
  gate:
    name: Verify merged desktop release PR
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.release.outputs.release }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      preview: ${{ steps.release.outputs.preview }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Verify release admission
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          echo "release=false" >> "$GITHUB_OUTPUT"

          pull_requests="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/pulls")"
          release_pr="$(jq -c '
            [
              .[]
              | select(.merged_at != null)
              | select(.base.ref == "main")
              | select(.head.repo.full_name == env.GITHUB_REPOSITORY)
              | select(.head.ref | startswith("release/desktop-v"))
            ]
            | if length == 1 then .[0] else empty end
          ' <<< "$pull_requests")"

          if [[ -z "$release_pr" ]]; then
            echo "This commit is not the merge of one desktop release PR; publication is skipped."
            exit 0
          fi

          pr_number="$(jq -r '.number' <<< "$release_pr")"
          head_ref="$(jq -r '.head.ref' <<< "$release_pr")"
          base_sha="$(jq -r '.base.sha' <<< "$release_pr")"
          version="$(jq -r '.desktop.version' config/release.json)"
          preview="$(jq -r '.desktop.preview' config/release.json)"
          tag="desktop-v${version}-preview.${preview}"

          if [[ "$head_ref" != "release/${tag}" ]]; then
            echo "Release branch ${head_ref} must be release/${tag}." >&2
            exit 1
          fi

          changed_files="$(gh api \
            -H "Accept: application/vnd.github+json" \
            --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/files" \
            --jq '.[].filename')"
          while IFS= read -r file; do
            case "$file" in
              .github/README.md|config/release.json|package.json|bun.lock) ;;
              *)
                echo "Desktop release PR #${pr_number} contains non-release file: ${file}" >&2
                exit 1
                ;;
            esac
          done <<< "$changed_files"

          git show "${base_sha}:package.json" > "$RUNNER_TEMP/package.base.json"
          jq -S 'del(.version)' "$RUNNER_TEMP/package.base.json" \
            > "$RUNNER_TEMP/package.base.normalized.json"
          jq -S 'del(.version)' package.json \
            > "$RUNNER_TEMP/package.release.normalized.json"
          cmp \
            "$RUNNER_TEMP/package.base.normalized.json" \
            "$RUNNER_TEMP/package.release.normalized.json"

          git show "${base_sha}:config/release.json" > "$RUNNER_TEMP/release.base.json"
          jq -S 'del(.desktop.version, .desktop.preview)' "$RUNNER_TEMP/release.base.json" \
            > "$RUNNER_TEMP/release.base.normalized.json"
          jq -S 'del(.desktop.version, .desktop.preview)' config/release.json \
            > "$RUNNER_TEMP/release.current.normalized.json"
          cmp \
            "$RUNNER_TEMP/release.base.normalized.json" \
            "$RUNNER_TEMP/release.current.normalized.json"

          CODEX_SKIN_EXPECTED_DESKTOP_TAG="$tag" bun run release:contract

          git fetch --force --tags origin
          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            tag_sha="$(git rev-list -n 1 "$tag")"
            if [[ "$tag_sha" != "$RELEASE_SHA" ]]; then
              echo "Tag ${tag} already points to ${tag_sha}, not ${RELEASE_SHA}." >&2
              exit 1
            fi
          fi

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "preview=${preview}" >> "$GITHUB_OUTPUT"

  build:
    name: Build and verify desktop artifacts
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: macos-14
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check source
        run: |
          bun run check
          bun run test

      - name: Build Apple Silicon preview
        env:
          CODEX_SKIN_DESKTOP_RELEASE_TAG: ${{ needs.gate.outputs.tag }}
        run: bun run desktop:dist:preview

      - name: Verify release artifacts
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        shell: bash
        run: |
          dmg="release/Codex-Skin-${VERSION}-arm64.dmg"
          zip="release/Codex-Skin-${VERSION}-arm64.zip"

          test -s "$dmg"
          test -s "$zip"
          hdiutil verify "$dmg"
          unzip -tq "$zip"

          preview_dir="$(mktemp -d)"
          unzip -q "$zip" -d "$preview_dir"
          app="$preview_dir/Codex Skin.app"
          binary="$app/Contents/MacOS/Codex Skin"

          test -d "$app"
          test -x "$binary"
          case " $(lipo -archs "$binary") " in
            *" arm64 "*) ;;
            *) exit 1 ;;
          esac

          bundle_id="$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app/Contents/Info.plist")"
          test "$bundle_id" = "com.anys.codex-skin"
          grep -Fq "${{ needs.gate.outputs.tag }}" desktop-dist/main.js

          if codesign -dv --verbose=4 "$app" 2>&1 | grep -q "Authority=Developer ID Application"; then
            echo "Preview unexpectedly contains a Developer ID signature." >&2
            exit 1
          fi

          (
            cd release
            shasum -a 256 \
              "Codex-Skin-${VERSION}-arm64.dmg" \
              "Codex-Skin-${VERSION}-arm64.zip" \
              > SHA256SUMS.txt
          )

      - name: Upload verified artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-skin-desktop-${{ needs.gate.outputs.version }}-${{ needs.gate.outputs.preview }}
          path: |
            release/Codex-Skin-${{ needs.gate.outputs.version }}-arm64.dmg
            release/Codex-Skin-${{ needs.gate.outputs.version }}-arm64.zip
            release/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    name: Tag and publish desktop prerelease
    needs:
      - gate
      - build
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download verified artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-skin-desktop-${{ needs.gate.outputs.version }}-${{ needs.gate.outputs.preview }}
          path: published

      - name: Verify checksums
        run: cd published && shasum -a 256 -c SHA256SUMS.txt

      - name: Create release tag
        env:
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          git fetch --force --tags origin
          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release ${TAG}" "$GITHUB_SHA"
          git push origin "refs/tags/${TAG}"

      - name: Create or repair GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: |
            ## Codex Skin macOS 开发预览

            这是面向 Apple Silicon Mac 的桌面客户端预览版。应用内置运行环境，普通用户无需安装 Node.js 或 Bun。

            ### 安装

            1. 下载并打开 DMG 资产。
            2. 将 `Codex Skin.app` 拖入“应用程序”文件夹后打开。
            3. 如果 macOS 阻止打开，请先确认下载来源与 SHA-256 校验值，再在“系统设置 → 隐私与安全性”中选择“仍要打开”。

            ### 当前限制

            - 仅支持 Apple Silicon。
            - 尚未使用 Apple Developer ID 签名，也未经过 Apple 公证。
            - 此版本是开发预览，不应视为完成正式分发条件的稳定版本。
          TAG: ${{ needs.gate.outputs.tag }}
          VERSION: ${{ needs.gate.outputs.version }}
          PREVIEW: ${{ needs.gate.outputs.preview }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" published/* --clobber
          else
            gh release create "$TAG" published/* \
              --verify-tag \
              --generate-notes \
              --notes "$RELEASE_NOTES" \
              --prerelease \
              --latest=false \
              --title "Codex Skin ${VERSION} · macOS preview ${PREVIEW}"
          fi

      - name: Verify published prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.gate.outputs.tag }}
        run: gh release view "$TAG" --json tagName,name,isDraft,isPrerelease,url
