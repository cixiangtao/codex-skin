version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Shanghai
    cooldown:
      default-days: 14
    open-pull-requests-limit: 2
    groups:
      routine-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "09:30"
      timezone: Asia/Shanghai
    cooldown:
      default-days: 14
    open-pull-requests-limit: 1
    groups:
      routine-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"
