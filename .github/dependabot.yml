version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Shanghai
    cooldown:
      default-days: 14
    open-pull-requests-limit: 2
    groups:
      runtime-updates:
        patterns:
          - clsx
          - picocolors
          - react
          - react-dom
          - tailwind-merge
        update-types:
          - minor
          - patch
      toolchain-updates:
        patterns:
          - "@babel/*"
          - "@tailwindcss/*"
          - "@types/*"
          - "@vitejs/*"
          - electron
          - electron-builder
          - oxlint
          - tailwindcss
          - typescript
          - vite
          - vitest
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@locator/babel-jsx"
        update-types:
          - "version-update:semver-minor"
      - dependency-name: "@rolldown/plugin-babel"
        update-types:
          - "version-update:semver-minor"
      - dependency-name: electron-vite
        update-types:
          - "version-update:semver-minor"
      - dependency-name: oxfmt
        update-types:
          - "version-update:semver-minor"
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "09:30"
      timezone: Asia/Shanghai
    cooldown:
      default-days: 14
    open-pull-requests-limit: 1
    groups:
      routine-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "ci(deps)"
